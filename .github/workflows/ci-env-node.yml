name: CI-ENV-NODE

env:
  NODE_VERSION: 20

on:
  pull_request:

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name : Check Node version
        run: node -v
        

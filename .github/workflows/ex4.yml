name: reusable workflow
on:
  workflow_call:
    inputs:
      LST_VERSION:
        required: false
        default: 'lts/*'
        type: string

jobs:
  run-npm-test:
    runs-on: ubuntu-latest
    steps:
        - name: checkout
          uses: actions/checkout@v6
        - name : setup node
          uses: actions/setup-node@v6
          with:
            node-version: 'lts/${{ inputs.LST_VERSION }}'
        - name: run test
          shell: bash
          run: |
            node -v
            npm install
            npm test